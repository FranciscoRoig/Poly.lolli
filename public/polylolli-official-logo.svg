<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <!-- Gradients for Rainbow Lollipop -->
    <radialGradient id="lollipopSwirl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#f43f5e" />
      <stop offset="20%" stopColor="#fb923c" />
      <stop offset="40%" stopColor="#facc15" />
      <stop offset="60%" stopColor="#4ade80" />
      <stop offset="80%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#a855f7" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="45%" stopColor="#facc15" />
      <stop offset="85%" stopColor="#eab308" />
      <stop offset="100%" stopColor="#ca8a04" />
    </linearGradient>
    <linearGradient id="blueOutfit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="40%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>
    <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3d1e03" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Giant Rainbow Swirl Lollipop (Left) -->
  <g id="lollipop" transform="translate(40, 80)">
    <!-- Wooden Stick -->
    <line x1="100" y1="120" x2="135" y2="190" stroke="#ca8a04" stroke-width="10" stroke-linecap="round" />
    <!-- Outer Lollipop Body -->
    <circle cx="95" cy="85" r="60" fill="url(#lollipopSwirl)" stroke="#451a03" stroke-width="5" />
    <!-- Spiral Ribbons -->
    <path d="M95 85 Q115 65 130 85 Q145 110 120 125 Q85 140 60 105 Q45 70 85 45 Q135 25 150 75" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85" />
    <circle cx="85" cy="70" r="10" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Floating Stars & Candies -->
  <path d="M165 95 L170 82 L175 95 L188 98 L175 102 L170 115 L165 102 L152 98 Z" fill="#fb923c" stroke="#451a03" stroke-width="2.5" />
  <path d="M90 225 L94 212 L98 225 L111 228 L98 232 L94 245 L90 232 L77 228 Z" fill="#facc15" stroke="#451a03" stroke-width="2.5" />
  <circle cx="120" cy="250" r="6" fill="#38bdf8" stroke="#0369a1" stroke-width="2" />

  <!-- Character: The Polylolli Girl in Blue with Microphone -->
  <g id="character" transform="translate(140, 45)">
    <!-- Hair Background -->
    <path d="M110 90 C70 50 200 10 260 70 C290 110 280 180 230 190 C180 200 130 170 110 90 Z" fill="#5c2c16" stroke="#2d1305" stroke-width="4" />

    <!-- Legs & Blue Shoes (Lying Down Position) -->
    <g transform="translate(180, 100)">
      <!-- Right Leg & Shoe -->
      <path d="M50 40 Q80 15 110 25" stroke="#fbcfe8" stroke-width="20" stroke-linecap="round" />
      <path d="M100 20 C110 10 135 20 125 40 C115 50 95 35 100 20 Z" fill="url(#blueOutfit)" stroke="#0f172a" stroke-width="3" />
      <!-- Left Leg & Shoe -->
      <path d="M40 70 Q75 60 110 75" stroke="#fbcfe8" stroke-width="20" stroke-linecap="round" />
      <path d="M100 70 C110 60 135 70 125 90 C115 100 95 85 100 70 Z" fill="url(#blueOutfit)" stroke="#0f172a" stroke-width="3" />
    </g>

    <!-- Blue Pleated Skirt -->
    <path d="M150 150 C180 140 210 160 200 195 C175 210 145 190 150 150 Z" fill="url(#blueOutfit)" stroke="#0f172a" stroke-width="3.5" />

    <!-- Blue Hoodie Torso (Lying Down On Stomach) -->
    <path d="M70 130 C100 110 170 125 170 180 C130 200 65 180 70 130 Z" fill="url(#blueOutfit)" stroke="#0f172a" stroke-width="4" />

    <!-- Left Arm & Hand Propping Up -->
    <path d="M70 155 Q80 200 110 205" stroke="url(#blueOutfit)" stroke-width="26" stroke-linecap="round" />
    <circle cx="115" cy="205" r="14" fill="#fde2d2" stroke="#2d1305" stroke-width="2.5" />

    <!-- Right Arm Holding Microphone -->
    <path d="M50 145 Q20 165 10 170" stroke="url(#blueOutfit)" stroke-width="24" stroke-linecap="round" />
    <circle cx="5" cy="172" r="13" fill="#fde2d2" stroke="#2d1305" stroke-width="2.5" />
    <!-- Microphone -->
    <rect x="-10" y="165" width="12" height="35" rx="3" fill="#1e293b" transform="rotate(25, -5, 175)" />
    <circle cx="-5" cy="155" r="14" fill="#64748b" stroke="#334155" stroke-width="2" />
    <!-- Mic Grid Lines -->
    <line x1="-12" y1="155" x2="2" y2="155" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="-5" y1="148" x2="-5" y2="162" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Head & Cheerful Face -->
    <circle cx="110" cy="120" r="50" fill="#fde2d2" stroke="#2d1305" stroke-width="3.5" />

    <!-- Brown Wavy Hair Front & Bangs -->
    <path d="M65 105 C75 75 110 65 155 75 C165 95 160 125 155 135 C145 115 130 110 115 118 C100 110 80 115 65 105 Z" fill="#5c2c16" stroke="#2d1305" stroke-width="3.5" />

    <!-- Blue Hairband with Big Bow Ribbon -->
    <path d="M80 80 C100 65 140 65 155 85" fill="none" stroke="#0284c7" stroke-width="9" stroke-linecap="round" />
    <!-- Bow Ribbon -->
    <g transform="translate(135, 55)">
      <ellipse cx="-10" cy="0" rx="14" ry="10" fill="#0284c7" stroke="#0f172a" stroke-width="2.5" />
      <ellipse cx="14" cy="-5" rx="14" ry="10" fill="#0284c7" stroke="#0f172a" stroke-width="2.5" />
      <circle cx="2" cy="-2" r="6" fill="#0369a1" />
    </g>

    <!-- Warm Sparkling Eyes -->
    <g id="eyes">
      <!-- Left Eye -->
      <ellipse cx="90" cy="122" rx="9" ry="12" fill="#3b1b0b" />
      <circle cx="87" cy="117" r="4" fill="#ffffff" />
      <circle cx="93" cy="125" r="2" fill="#ffffff" />
      <!-- Right Eye -->
      <ellippse cx="128" cy="122" rx="9" ry="12" fill="#3b1b0b" />
      <circle cx="125" cy="117" r="4" fill="#ffffff" />
      <circle cx="131" cy="125" r="2" fill="#ffffff" />
    </g>

    <!-- Rosy Cheeks -->
    <circle cx="76" cy="135" r="9" fill="#f43f5e" opacity="0.45" />
    <circle cx="142" cy="135" r="9" fill="#f43f5e" opacity="0.45" />

    <!-- Happy Open Smile -->
    <path d="M96 138 Q110 160 124 138 Z" fill="#991b1b" stroke="#2d1305" stroke-width="2.5" />
    <path d="M102 148 Q110 156 118 148" fill="#f43f5e" />
  </g>

  <!-- Big 3D Golden Brand Title: POLYLOLLI -->
  <g id="brandTitle" transform="translate(250, 310)" text-anchor="middle">
    <!-- 3D Shadow Layers -->
    <text x="0" y="28" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="76" fill="#3b1d06" stroke="#220e03" stroke-width="16" stroke-linejoin="round">
      POLYLOLLI
    </text>
    <text x="0" y="24" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="76" fill="#78350f" stroke="#451a03" stroke-width="12" stroke-linejoin="round">
      POLYLOLLI
    </text>
    <text x="0" y="16" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="76" fill="#b45309" stroke="#78350f" stroke-width="8" stroke-linejoin="round">
      POLYLOLLI
    </text>
    <!-- Foreground Golden Glow Lettering -->
    <text x="0" y="12" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="76" fill="url(#goldText)" stroke="#451a03" stroke-width="4.5" stroke-linejoin="round">
      POLYLOLLI
    </text>
  </g>

  <!-- Subtitle: ART & LIK -->
  <g id="brandSubtitle" transform="translate(250, 385)" text-anchor="middle">
    <text x="0" y="14" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#3b1d06" stroke="#220e03" stroke-width="10" stroke-linejoin="round">
      ARH &amp; LIK
    </text>
    <text x="0" y="10" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#78350f" stroke="#451a03" stroke-width="7" stroke-linejoin="round">
      ARH &amp; LIK
    </text>
    <text x="0" y="6" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="url(#goldText)" stroke="#451a03" stroke-width="3" stroke-linejoin="round">
      ARH &amp; LIK
    </text>
  </g>
</svg>
